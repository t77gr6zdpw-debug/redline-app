name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/redline-probiznes-microsite-mj4gtu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build (project-page subpath)
        env:
          VITE_BASE_PATH: /redline-app/
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
          VITE_TELEGRAM_CONTACT_URL: ${{ vars.VITE_TELEGRAM_CONTACT_URL }}
          VITE_PROBIZNES_TELEGRAM_URL: ${{ vars.VITE_PROBIZNES_TELEGRAM_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
